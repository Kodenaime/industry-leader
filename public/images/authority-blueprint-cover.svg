<svg width="800" height="1040" viewBox="0 0 800 1040" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Authority Blueprint guide cover</title>
  <desc id="desc">A branded cover for the free guide, The Authority Blueprint.</desc>
  <rect width="800" height="1040" fill="#F4F2EE"/>
  <rect width="800" height="14" fill="#C6A15B"/>
  <rect x="0" y="1026" width="800" height="14" fill="#C6A15B"/>

  <text x="72" y="140" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="6" fill="#8C6A35">FREE GUIDE</text>
  <rect x="72" y="170" width="80" height="2" fill="#C6A15B"/>

  <text x="72" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="600" letter-spacing="-2" fill="#171717">The Authority</text>
  <text x="72" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="600" letter-spacing="-2" fill="#171717">Blueprint</text>

  <text x="72" y="470" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4A4844">Five shifts that make you the leader</text>
  <text x="72" y="504" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#4A4844">your industry follows.</text>


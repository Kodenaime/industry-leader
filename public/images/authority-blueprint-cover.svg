  <text x="72" y="666" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#6F6B64">INSIDE</text>
  <text x="72" y="704" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#242321">Own your leadership identity</text>
  <text x="72" y="740" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#242321">Sharpen a point of view that commands attention</text>
  <text x="72" y="776" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#242321">Build influence without relying on title</text>
  <text x="72" y="812" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#242321">Communicate with executive presence</text>
  <text x="72" y="848" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#242321">Turn clarity into a 90-day plan</text>

  <circle cx="676" cy="916" r="46" fill="#242321"/>
  <text x="676" y="931" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#E9DCC3">IL</text>

  <text x="72" y="906" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#6F6B64">THE INDUSTRY LEADER</text>
  <text x="72" y="936" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#242321">Matthew Ogieva</text>
  <text x="72" y="964" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6F6B64">Business Reimagined Incorporated</text>
